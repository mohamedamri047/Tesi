<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - Poliambulatorio</title>
    <link rel="stylesheet" href="/css/stile.css">
    <script src="/js/api.js" defer></script>
    <script src="/js/login.js" defer></script>
</head>
<body>

<main class="pagina-login">
    <section class="scheda">
        <div class="intestazione">
            <h1>Poliambulatorio</h1>
            <p>Accedi per prenotare una visita e consultare le tue prenotazioni.</p>
        </div>

        <form id="modulo-login">
            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       placeholder="Inserisci la tua email"
                       autocomplete="username" required>
            </div>
            <div class="campo">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Inserisci la password"
                       autocomplete="current-password" required>
            </div>
            <p id="messaggio-errore" class="messaggio-errore" role="alert" hidden></p>
            <button type="submit" id="pulsante-login" class="pulsante-primario">
                Accedi
            </button>
        </form>
    </section>
</main>

</body>
</html>
